  # ══════════════════════════════════════════════════════════════
  # COMMENTS
  # ══════════════════════════════════════════════════════════════
  /comments:
    post:
      tags: [Comments]
      summary: Poster un commentaire
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [articleId, content]
              properties:
                articleId:
                  type: string
                  format: uuid
                content:
                  type: string
                  minLength: 2
                  maxLength: 2000
                  example: Great article!
                parentId:
                  type: string
                  format: uuid
                  nullable: true
                  description: ID du commentaire parent pour une réponse
      responses:
        '201':
          description: Commentaire soumis (en attente de modération)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          comment:
                            $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /comments/article/{articleId}:
    get:
      tags: [Comments]
      summary: Commentaires d'un article
      description: Public — retourne uniquement les commentaires approuvés
      parameters:
        - in: path
          name: articleId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          description: Commentaires paginés avec réponses imbriquées
          content:
